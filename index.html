</head>
<body>
<main aria-label="交友首页">
    <img id="page" src="assets/page.png" alt="" style="left:0.000000000%;top:0.000000000%;width:100.000000000%;height:100.000000000%">
  <header aria-label="系统状态，9:41">

    <button data-action="home" aria-label="首页" aria-current="page"></button>
    <button data-action="feed" aria-label="动态"></button>
    <button data-action="publish" aria-label="发布"></button>
    <button data-action="messages" aria-label="消息，2条未读"></button>
    <button data-action="me" aria-label="我的"></button>

</html>
